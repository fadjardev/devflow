[project]
name = "devflow"
version = "0.1.0"
description = "Supervised AI coding workflow driven from Telegram: Claude Code plans and reviews, opencode writes the code, you approve the plan and the diff"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-telegram-bot>=21",
    "httpx>=0.27",
    "pyyaml>=6",
    "mcp>=2.2,<3",
    "playwright>=1.45",
    "python-dotenv>=1",
    "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
devflow = "devflow.cli:main"

[tool.setuptools]
packages = ["devflow", "devflow.vhosts"]

[tool.setuptools.package-data]
devflow = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["devflow"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Modules converted to strict typing. Add a module here once it passes; new modules start here.
[[tool.mypy.overrides]]
module = [
    "devflow.__main__",
    "devflow.claude",
    "devflow.cli",
    "devflow.config",
    "devflow.fmt",
    "devflow.gitsafe",
    "devflow.logs",
    "devflow.mcp_server",
    "devflow.platform",
    "devflow.projects",
    "devflow.redact",
    "devflow.security",
    "devflow.sync",
    "devflow.tasks",
    "devflow.vault",
    "devflow.verify",
    "devflow.vhosts",
    "devflow.vhosts.*",
    "devflow.worktree",
]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.ruff.lint.per-file-ignores]
# Fixtures imported from another test module are used as parameters of the same name.
"tests/*" = ["F811"]
