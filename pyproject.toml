[project]
name = "devflow"
version = "0.1.0"
description = "Supervised AI coding workflow driven from Telegram: Claude Code plans and reviews, opencode writes the code, you approve the plan and the diff"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-telegram-bot>=21",
    "httpx>=0.27",
    "pyyaml>=6",
    "mcp>=2.2,<3",
    "playwright>=1.45",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["devflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]
