name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # weekly, for advisories published after the last change

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install devflow and pip-audit
        run: python -m pip install -e . pip-audit  # editable, so --skip-editable leaves devflow itself out
      - name: Audit installed dependencies
        run: python -m pip_audit --skip-editable --strict --progress-spinner off

  sast:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Scan
        run: semgrep scan --config p/python --config p/secrets --severity ERROR --error --metrics off devflow
