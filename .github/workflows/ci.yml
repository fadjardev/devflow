name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Git identity for test repositories
        run: |
          git config --global user.name "devflow ci"
          git config --global user.email "ci@devflow.invalid"
          git config --global init.defaultBranch main
      - name: Ruff
        run: python -m ruff check devflow tests
      - name: Mypy
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q

  package:
    name: wheel installs and runs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build
        run: python -m pip install build pipx && python -m build
      - name: Install the wheel with pipx
        run: python -m pipx install dist/*.whl
      - name: devflow runs from the installed wheel
        run: |
          devflow --version
          mkdir -p smoke/app && git -C smoke/app init -q
          printf '[telegram]\nchat_id = 1\n[paths]\nruntime = "rt"\n[projects.app]\npath = "app"\n' > smoke/devflow.toml
          set +e
          DEVFLOW_CONFIG=smoke/devflow.toml devflow doctor | tee doctor.txt
          set -e
          grep -q "settings: .*devflow.toml" doctor.txt
          grep -q "ok   app:" doctor.txt
